<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 通貨・銘柄 24時間強弱メーター</title>
<style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; margin: 0; }
    .container { max-width: 600px; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto; box-sizing: border-box; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
    .header h2 { margin: 0; font-size: 18px; color: #2c3e50; }
    .update-btn { background-color: #3498db; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .update-btn:hover { background-color: #2980b9; }
    .status-text { font-size: 11px; color: #7f8c8d; text-align: right; margin-bottom: 20px; height: 14px; }
    .asset-row { display: flex; align-items: center; margin-bottom: 15px; }
    .asset-name { width: 50px; font-weight: bold; font-size: 15px; color: #34495e; }
    .bar-area { flex-grow: 1; display: flex; align-items: center; position: relative; height: 26px; background-color: #f9f9f9; border-radius: 4px; margin: 0 15px; border: 1px solid #eee; }
    .zero-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background-color: #bdc3c7; z-index: 10; }
    .bar-half { width: 50%; height: 100%; display: flex; }
    .bar-left { justify-content: flex-end; } .bar-right { justify-content: flex-start; }
    .bar-fill { height: 100%; width: 0%; transition: width 1s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .fill-positive { background-color: #2ecc71; border-radius: 0 4px 4px 0; }
    .fill-negative { background-color: #e74c3c; border-radius: 4px 0 0 4px; }
    .asset-value { width: 70px; text-align: right; font-size: 14px; font-weight: bold; }
    .val-pos { color: #27ae60; } .val-neg { color: #c0392b; } .val-zero { color: #7f8c8d; }
    .back-link { display: inline-block; margin-top: 30px; font-size: 14px; color: #3498db; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>🔥 24時間強弱メーター (対USD)</h2>
        <button id="updateBtn" class="update-btn" onclick="fetchAndRenderData()">🔄 更新</button>
    </div>
    <div id="statusText" class="status-text">データを取得待機中...</div>
    <div id="chart-container"></div>
    <a href="index.html" class="back-link">← 目次へ戻る</a>
</div>
<script>
    window.onload = fetchAndRenderData;

    async function fetchAndRenderData() {
        const btn = document.getElementById('updateBtn');
        const status = document.getElementById('statusText');
        const container = document.getElementById('chart-container');
        
        btn.disabled = true; 
        status.innerHTML = 'データを取得中...'; 
        container.innerHTML = '';
        
        let results = [];
        let hasError = false;

        // ==========================================
        // 1. 暗号資産（Binance API）
        // ==========================================
        try {
            const btcRes = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT');
            if (btcRes.ok) {
                const btcData = await btcRes.json();
                results.push({ symbol: 'BTC', changePercent: parseFloat(btcData.priceChangePercent) });
            }
        } catch (e) { console.warn('BTCエラー'); hasError = true; }

        try {
            const xauRes = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=PAXGUSDT');
            if (xauRes.ok) {
                const xauData = await xauRes.json();
                results.push({ symbol: 'XAU', changePercent: parseFloat(xauData.priceChangePercent) });
            }
        } catch (e) { console.warn('XAUエラー'); hasError = true; }

        // ==========================================
        // 2. 法定通貨（jsDelivr CDN API）
        // ==========================================
        try {
            const latestRes = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
            if (!latestRes.ok) throw new Error('CDN Latest Error');
            const latestData = await latestRes.json();
            const usdLatest = latestData.usd;

            // 🌟【究極の修正】CDNが返してきた「日付」を起点にして遡る！
            // これにより、CDNのキャッシュルーレットによる乱高下を完全にシャットアウトします。
            const baseDateStr = latestData.date; 
            const baseDate = new Date(baseDateStr);

            let pastData = null;
            for (let i = 1; i <= 10; i++) {
                const d = new Date(baseDate); 
                d.setDate(d.getDate() - i);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}-${mm}-${dd}`;
                
                try {
                    const pastRes = await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${dateStr}/v1/currencies/usd.json`);
                    if (pastRes.ok) {
                        const pastJson = await pastRes.json();
                        // 休場日スキップ判定
                        if (pastJson.usd && pastJson.usd.jpy !== usdLatest.jpy) {
                            pastData = pastJson.usd;
                            break; 
                        }
                    }
                } catch (e) { }
            }

            if (usdLatest && pastData) {
                const fiatSymbols = ['eur', 'jpy', 'gbp', 'aud', 'chf', 'cad', 'nzd'];
                fiatSymbols.forEach(sym => {
                    if (usdLatest[sym] && pastData[sym]) {
                        const currentRate = usdLatest[sym];
                        const prevRate = pastData[sym];
                        const changePercent = ((prevRate / currentRate) - 1) * 100;
                        results.push({ symbol: sym.toUpperCase(), changePercent: changePercent });
                    }
                });
                results.push({ symbol: 'USD', changePercent: 0 });
            } else {
                throw new Error('Past data not found');
            }
        } catch (e) {
            console.warn('法定通貨CDN取得エラー:', e);
            hasError = true;
        }

        // ==========================================
        // 3. 描画処理と「休場判定」ロジック
        // ==========================================
        if (results.length > 2) {
            results.sort((a, b) => b.changePercent - a.changePercent);
            renderChart(results);
            
            // 法定通貨の合計変動幅を計算
            let totalFiatChange = 0;
            results.forEach(r => {
                if(r.symbol !== 'BTC' && r.symbol !== 'XAU' && r.symbol !== 'USD') {
                    totalFiatChange += Math.abs(r.changePercent);
                }
            });

            const now = new Date(); 
            let timeStr = `最終更新: ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            
            // 休場メッセージの確実な表示
            if (hasError) {
                timeStr += ' <span style="color:#e74c3c;">(一部通信制限あり)</span>';
            } else if (totalFiatChange < 0.20) { 
                timeStr += ' <span style="color:#f39c12; font-weight:bold;">(※週明け・市場オープン前)</span>';
            }
            
            status.innerHTML = timeStr;
            
        } else {
            status.innerHTML = '<span style="color:#e67e22;">通信制限のためサンプルデータを表示中</span>';
            const dummyData = [
                { symbol: 'USD', changePercent: 0.00 }, { symbol: 'BTC', changePercent: 0.77 },
                { symbol: 'XAU', changePercent: 1.19 }, { symbol: 'JPY', changePercent: -0.11 },
                { symbol: 'EUR', changePercent: 0.32 }, { symbol: 'GBP', changePercent: 0.42 },
                { symbol: 'AUD', changePercent: 0.54 }, { symbol: 'CHF', changePercent: -0.20 },
                { symbol: 'CAD', changePercent: 0.15 }, { symbol: 'NZD', changePercent: 0.35 }
            ];
            dummyData.sort((a, b) => b.changePercent - a.changePercent);
            renderChart(dummyData);
        }

        btn.disabled = false; 
    }

    function renderChart(data) {
        const container = document.getElementById('chart-container');
        const maxAbs = Math.max(...data.map(i => Math.abs(i.changePercent)));
        const scale = maxAbs === 0 ? 1 : 100 / maxAbs; 
        
        data.forEach(item => {
            const chg = parseFloat(item.changePercent).toFixed(2);
            const isPos = chg > 0; const isZero = chg == 0;
            const w = Math.abs(chg) * scale; 
            
            const row = document.createElement('div'); row.className = 'asset-row';
            row.innerHTML = `
                <div class="asset-name">${item.symbol}</div>
                <div class="bar-area">
                    <div class="bar-half bar-left"></div>
                    <div class="zero-line"></div>
                    <div class="bar-half bar-right"></div>
                </div>
                <div class="asset-value ${isZero ? 'val-zero' : (isPos ? 'val-pos' : 'val-neg')}">${isPos ? '+' : ''}${chg}%</div>
            `;
            
            const fill = document.createElement('div');
            fill.className = 'bar-fill ' + (isPos ? 'fill-positive' : 'fill-negative');
            setTimeout(() => fill.style.width = w + '%', 50);
            
            if (isPos) {
                row.querySelector('.bar-right').appendChild(fill);
            } else if (!isZero) {
                row.querySelector('.bar-left').appendChild(fill);
            }
            container.appendChild(row);
        });
    }
</script>
</body>
</html>
